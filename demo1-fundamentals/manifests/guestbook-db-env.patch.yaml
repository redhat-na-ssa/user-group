# Part 3: give the guestbook the database credentials from the Secret the
# PostgreSQL template created (named "postgresql"). The app reads
# POSTGRESQL_*; the Secret's keys are database-* - so each variable maps a
# name to a key, exactly like one row in the console's Environment tab.
#   oc patch deployment/guestbook --patch-file=guestbook-db-env.patch.yaml
spec:
  template:
    spec:
      containers:
        - name: guestbook
          env:
            - name: POSTGRESQL_USER
              valueFrom:
                secretKeyRef: {name: postgresql, key: database-user}
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef: {name: postgresql, key: database-password}
            - name: POSTGRESQL_DATABASE
              valueFrom:
                secretKeyRef: {name: postgresql, key: database-name}
