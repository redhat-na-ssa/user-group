# Part 6 (optional): let the VPA apply its recommendation - only when a pod
# starts ("Initial": it never restarts a running pod). Memory only, as in
# guestbook-vpa.yaml: CPU stays with the HPA.
# The memory limit follows the request at the same ratio (512Mi / 320Mi).
#   oc patch vpa guestbook --type=merge --patch-file=guestbook-vpa-initial.patch.yaml
#   oc rollout restart deployment/guestbook
spec:
  updatePolicy:
    updateMode: "Initial"
