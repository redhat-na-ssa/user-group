<svg xmlns="http://www.w3.org/2000/svg">
  <!-- Diagram icon set in the style of the Red Hat OpenShift concept slides:
       red line art (currentColor), 100x100 view boxes. deck.js injects this
       file into every deck; diagrams use them as
         <use href="#i-pod" x="…" y="…" width="80" height="80"/>
       Colour comes from CSS (`color`), red by default. -->
  <defs>
    <marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ee0000"/>
    </marker>
    <marker id="dg-arrow-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8d90"/>
    </marker>
  </defs>

  <!-- container: a hexagon -->
  <symbol id="i-container" viewBox="0 0 100 100">
    <polygon points="50,8 86.4,29 86.4,71 50,92 13.6,71 13.6,29" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round"/>
  </symbol>

  <!-- container image: hexagon with </> -->
  <symbol id="i-image" viewBox="0 0 100 100">
    <polygon points="50,8 86.4,29 86.4,71 50,92 13.6,71 13.6,29" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round"/>
    <path d="M38,39 L28,50 L38,61 M62,39 L72,50 L62,61 M55,36 L45,64" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <!-- image registry: brackets around three small hexagons -->
  <symbol id="i-registry" viewBox="0 0 100 100">
    <path d="M24,12 H10 V88 H24 M76,12 H90 V88 H76" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round"/>
    <polygon points="38,24 49,30.5 49,43.5 38,50 27,43.5 27,30.5" fill="none" stroke="currentColor" stroke-width="4"/>
    <polygon points="62,24 73,30.5 73,43.5 62,50 51,43.5 51,30.5" fill="none" stroke="currentColor" stroke-width="4"/>
    <polygon points="50,50 61,56.5 61,69.5 50,76 39,69.5 39,56.5" fill="none" stroke="currentColor" stroke-width="4"/>
  </symbol>

  <!-- pod: thick ring around a container -->
  <symbol id="i-pod" viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="44" fill="none" stroke="currentColor" stroke-width="8"/>
    <polygon points="50,28 69,39 69,61 50,72 31,61 31,39" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round"/>
  </symbol>

  <!-- pod that is starting / not there yet: dashed ring, filled -->
  <symbol id="i-pod-new" viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="44" fill="currentColor" fill-opacity="0.25" stroke="currentColor" stroke-width="8" stroke-dasharray="14 9"/>
    <polygon points="50,28 69,39 69,61 50,72 31,61 31,39" fill="none" stroke="currentColor" stroke-width="5" stroke-dasharray="7 5" stroke-linejoin="round"/>
  </symbol>

  <!-- service / route: a large hexagon (label is drawn inside by the diagram) -->
  <symbol id="i-hex" viewBox="0 0 100 100">
    <polygon points="50,4 89.8,27 89.8,73 50,96 10.2,73 10.2,27" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/>
  </symbol>

  <!-- document with folded corner: Deployment, ConfigMap, Secret -->
  <symbol id="i-doc" viewBox="0 0 100 100">
    <path d="M20,6 H62 L82,26 V94 H20 Z" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round"/>
    <path d="M62,6 V26 H82" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round"/>
  </symbol>

  <!-- persistent storage: a disk -->
  <symbol id="i-disk" viewBox="0 0 100 100">
    <ellipse cx="50" cy="24" rx="36" ry="12" fill="none" stroke="currentColor" stroke-width="5"/>
    <path d="M14,24 V76 A36,12 0 0 0 86,76 V24 M14,50 A36,12 0 0 0 86,50" fill="none" stroke="currentColor" stroke-width="5"/>
  </symbol>

  <!-- node / machine -->
  <symbol id="i-node" viewBox="0 0 100 100">
    <rect x="8" y="16" width="84" height="68" rx="6" fill="none" stroke="currentColor" stroke-width="5"/>
    <path d="M8,38 H92" stroke="currentColor" stroke-width="4"/>
    <circle cx="20" cy="27" r="4" fill="currentColor"/><circle cx="32" cy="27" r="4" fill="currentColor"/>
  </symbol>

  <!-- user -->
  <symbol id="i-user" viewBox="0 0 100 100">
    <circle cx="50" cy="32" r="18" fill="none" stroke="currentColor" stroke-width="5"/>
    <path d="M16,92 C16,62 84,62 84,92" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
  </symbol>

  <!-- browser window -->
  <symbol id="i-browser" viewBox="0 0 100 100">
    <rect x="5" y="14" width="90" height="72" rx="4" fill="none" stroke="currentColor" stroke-width="5"/>
    <path d="M5,32 H95" stroke="currentColor" stroke-width="4"/>
    <circle cx="16" cy="23" r="3.5" fill="currentColor"/><circle cx="27" cy="23" r="3.5" fill="currentColor"/>
  </symbol>

  <!-- source code repository (git) -->
  <symbol id="i-git" viewBox="0 0 100 100">
    <circle cx="30" cy="22" r="10" fill="none" stroke="currentColor" stroke-width="5"/>
    <circle cx="30" cy="78" r="10" fill="none" stroke="currentColor" stroke-width="5"/>
    <circle cx="72" cy="36" r="10" fill="none" stroke="currentColor" stroke-width="5"/>
    <path d="M30,32 V68 M72,46 C72,62 30,56 30,68" fill="none" stroke="currentColor" stroke-width="5"/>
  </symbol>

  <!-- pipeline task: a gear-less "play" step -->
  <symbol id="i-task" viewBox="0 0 100 100">
    <rect x="6" y="22" width="88" height="56" rx="28" fill="none" stroke="currentColor" stroke-width="5"/>
    <path d="M42,38 L62,50 L42,62 Z" fill="currentColor"/>
  </symbol>

  <!-- lock, for secrets -->
  <symbol id="i-lock" viewBox="0 0 100 100">
    <rect x="20" y="44" width="60" height="46" rx="6" fill="none" stroke="currentColor" stroke-width="5"/>
    <path d="M32,44 V32 A18,18 0 0 1 68,32 V44" fill="none" stroke="currentColor" stroke-width="5"/>
    <circle cx="50" cy="64" r="5" fill="currentColor"/><path d="M50,68 V78" stroke="currentColor" stroke-width="5"/>
  </symbol>
</svg>
