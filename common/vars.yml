# Cluster-wide settings shared by all demo playbooks (Ansible counterpart of
# common/env.sh). Load with:  vars_files: ../common/vars.yml
# The cluster is the one the playbook's kubeconfig points at (the current
# `oc login`): read from its config, nothing here names a cluster.
ocp_api: "{{ lookup('kubernetes.core.k8s', api_version='config.openshift.io/v1', kind='Infrastructure', resource_name='cluster').status.apiServerURL }}"
ocp_console: "{{ lookup('kubernetes.core.k8s', api_version='config.openshift.io/v1', kind='Console', resource_name='cluster').status.consoleURL }}"
ocp_apps_domain: "{{ lookup('kubernetes.core.k8s', api_version='config.openshift.io/v1', kind='Ingress', resource_name='cluster').spec.domain }}"

gitea_url: "https://local-gitea-gitea.{{ ocp_apps_domain }}"
gitea_internal_url: http://local-gitea.gitea.svc:3000   # what pipelines clone from
gitea_user: demo
gitea_password: welcome1
gitea_org: ocpdemo

demo_user_password: welcome1

# Presentation namespace: slide decks + follow-up app
faa_namespace: faa-demo
