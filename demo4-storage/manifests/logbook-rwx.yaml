# Part 4: a pod on every worker node, all sharing one RWX CephFS claim
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: logbook-shared
  labels: {app: logbook-rwx}
spec:
  storageClassName: ocs-storagecluster-cephfs
  accessModes: [ReadWriteMany]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: logbook-rwx
  labels: {app: logbook-rwx, app.kubernetes.io/part-of: logbook}
spec:
  selector:
    matchLabels: {app: logbook-rwx}
  template:
    metadata:
      labels: {app: logbook-rwx}
    spec:
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: logbook-shared}
      containers:
        - name: logbook
          # Writes a line every 5 s (time, pod, node) to /data/logbook.txt and
          # serves /data over HTTP - the "app" of this demo
          image: registry.access.redhat.com/ubi9/python-312:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              while true; do
                echo "$(date -u +%H:%M:%S)  $POD_NAME  on  $NODE_NAME" >> /data/logbook.txt
                sleep 5
              done &
              exec python3 -m http.server 8080 --directory /data
          env:
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
          ports:
            - containerPort: 8080
          resources:
            requests: {cpu: 10m, memory: 64Mi}
            limits: {cpu: 100m, memory: 128Mi}
          volumeMounts:
            - name: data
              mountPath: /data
---
apiVersion: v1
kind: Service
metadata:
  name: logbook-rwx
  labels: {app: logbook-rwx}
spec:
  selector: {app: logbook-rwx}
  ports:
    - name: http
      port: 8080
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: logbook-rwx
  labels: {app: logbook-rwx}
spec:
  to: {kind: Service, name: logbook-rwx}
  port: {targetPort: http}
  tls: {termination: edge, insecureEdgeTerminationPolicy: Redirect}
