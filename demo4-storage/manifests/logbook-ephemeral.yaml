# Part 1 (staged by setup): the logbook with an emptyDir - its data lives and
# dies with the pod. Part 2 swaps the volume for the PVC logbook-data.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logbook
  labels: {app: logbook, app.kubernetes.io/part-of: logbook}
spec:
  replicas: 1
  # Recreate, not RollingUpdate: with an RWO volume a rolling update could
  # start the new pod on another node while the old one still holds the disk
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: logbook}
  template:
    metadata:
      labels: {app: logbook}
    spec:
      volumes:
        - name: data
          emptyDir: {}
      containers:
        - name: logbook
          # Writes a line every 5 s (time, pod, node) to /data/logbook.txt and
          # serves /data over HTTP - the "app" of this demo
          image: registry.access.redhat.com/ubi9/python-312:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              while true; do
                echo "$(date -u +%H:%M:%S)  $POD_NAME  on  $NODE_NAME" >> /data/logbook.txt
                sleep 5
              done &
              exec python3 -m http.server 8080 --directory /data
          env:
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
          ports:
            - containerPort: 8080
          resources:
            requests: {cpu: 10m, memory: 64Mi}
            limits: {memory: 128Mi}
          volumeMounts:
            - name: data
              mountPath: /data
---
apiVersion: v1
kind: Service
metadata:
  name: logbook
  labels: {app: logbook}
spec:
  selector: {app: logbook}
  ports:
    - name: http
      port: 8080
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: logbook
  labels: {app: logbook}
spec:
  to: {kind: Service, name: logbook}
  port: {targetPort: http}
  tls: {termination: edge, insecureEdgeTerminationPolicy: Redirect}
