# Part 4: three replicas on three different nodes, one RWO claim. One pod
# starts; the others hang in ContainerCreating with a Multi-Attach error.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: logbook-rwo-data
  labels: {app: logbook-rwo}
spec:
  storageClassName: ocs-storagecluster-ceph-rbd
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logbook-rwo
  labels: {app: logbook-rwo, app.kubernetes.io/part-of: logbook}
spec:
  replicas: 3
  selector:
    matchLabels: {app: logbook-rwo}
  template:
    metadata:
      labels: {app: logbook-rwo}
    spec:
      # one pod per node, so the demo always shows the cross-node conflict
      # (pods on the same node could share an RWO volume)
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels: {app: logbook-rwo}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: logbook-rwo-data}
      containers:
        - name: logbook
          # Writes a line every 5 s (time, pod, node) to /data/logbook.txt and
          # serves /data over HTTP - the "app" of this demo
          image: registry.access.redhat.com/ubi9/python-312:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              while true; do
                echo "$(date -u +%H:%M:%S)  $POD_NAME  on  $NODE_NAME" >> /data/logbook.txt
                sleep 5
              done &
              exec python3 -m http.server 8080 --directory /data
          env:
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
          ports:
            - containerPort: 8080
          resources:
            requests: {cpu: 10m, memory: 64Mi}
            limits: {cpu: 100m, memory: 128Mi}
          volumeMounts:
            - name: data
              mountPath: /data
